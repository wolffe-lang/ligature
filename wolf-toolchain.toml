# identity. Objects the pinned compiler emits link against this runtime and
# no other: their entry calls __wolf_rt_main_start (#962/#963), so objects and
# runtime come from one release. The link bundle (tools/fetch-bundle) carries
# a copy of this same archive member, checked against this digest by
# tests/bundle-smoke.py. Never the GNU archive's libwolf_rt.a.
# tools/fetch-musl-runtime reads both digests twice.
