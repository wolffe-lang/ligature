# ld03b: release APIs for wolf v0.2.38 (tag commit 95ae0827), lupin v0.1.60
# (tag commit 17bd5223) and wolf-rt 0.2.38 read twice 2026-11-09; every
# archive below hashed twice on the Mac and compared with the release pages.
# The complete wolf archive bundles the std pin (d4a4d4ca) and the GNU
# runtime. The musl link bundle is its own pin (tools/fetch-bundle,
# tests/pax-link.sums), never this file's; its runtime member is [wolf-rt]'s.
# (r41p: release APIs 427033151 and 425116893 read twice 2026-10-31.
# ct02: release APIs 421613621 and 421458363 read twice 2026-10-23.)

