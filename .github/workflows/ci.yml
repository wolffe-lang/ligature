# Local PR evidence is cheap unless ci/full-matrix opts in.
# Existing nightly commands and publication jobs are preserved.
name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [trunk]
    paths:
      - '.github/**'
      - 'ci/**'
      - '!ci/*.md'
      - '!ci/**/*.md'
      - 'tools/**'
      - 'spec/**'
      - '**/wolf-toolchain.toml'
      - '**/rust-toolchain.toml'
      - '**/*.pin'
      - '**/PAIRING'
      - '**/STD-PIN'
      - 'vendor/tools.toml'
      - 'gnu-oracle.toml'
      - '.gitmodules'
      - 'Cargo.toml'
      - 'Cargo.lock'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Space-separated job ids; empty selects full'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}-{1}', github.head_ref, contains(github.event.pull_request.labels.*.name, 'full-matrix') && 'full' || 'pr') || format('ci-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-matrix') || contains(github.event.pull_request.labels.*.name, 'ci') || contains(github.event.pull_request.labels.*.name, 'release-matrix') }}
        with:
          fetch-depth: 2
      - id: plan
        if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-matrix') || contains(github.event.pull_request.labels.*.name, 'ci') || contains(github.event.pull_request.labels.*.name, 'release-matrix') }}
        env:
          EVENT: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'release-matrix') && 'push' || github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IN_JOBS: ${{ inputs.jobs }}
        run: python3 -I ci/tiers.py plan --merge --github-output "$GITHUB_OUTPUT"
      - name: local gate wiring proof
        if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-matrix') || contains(github.event.pull_request.labels.*.name, 'ci') || contains(github.event.pull_request.labels.*.name, 'release-matrix') }}
        run: python3 -I ci/local-gate-test.py
      - name: local evidence gate
        if: ${{ !(github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-matrix') || contains(github.event.pull_request.labels.*.name, 'ci') || contains(github.event.pull_request.labels.*.name, 'release-matrix')) }}
        run: echo 'Local gauntlet evidence is the gate; request ci or full-matrix for CI.'
  plan-test:
    needs: plan
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-matrix') || contains(github.event.pull_request.labels.*.name, 'ci') || contains(github.event.pull_request.labels.*.name, 'release-matrix')) && (contains(fromJSON(needs.plan.outputs.jobs || '[]'), 'plan-test')) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I tests/tiers.py
  linux:
    needs: plan
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-matrix') || contains(github.event.pull_request.labels.*.name, 'ci') || contains(github.event.pull_request.labels.*.name, 'release-matrix')) && (contains(fromJSON(needs.plan.outputs.jobs || '[]'), 'linux')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ligature-oracle -f ci/oracle.Containerfile ci
      - run: docker run --rm -v "$PWD:/work" ligature-oracle bash -c 'tools/fetch-toolchain && tools/fetch-bundle && tools/check --require-licensed-bundle'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-evidence
          path: target/evidence
  tier:
    name: tier ${{ needs.plan.outputs.tier || 'unplanned' }}
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-matrix') || contains(github.event.pull_request.labels.*.name, 'ci') || contains(github.event.pull_request.labels.*.name, 'release-matrix')) && (!cancelled()) }}
    needs:
      - plan
      - plan-test
      - linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 -I ci/tiers.py verdict
